<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Main replication result: gross annualized Sharpe ratio</title>
  <desc id="desc">Our versus paper Sharpe ratios for CNN plus Transformer, Fourier plus FFN, and OU plus Threshold on FF5 and PCA5 residuals. The model ranking matches, our values are lower, and PCA5 outperforms FF5.</desc>
  <rect width="1600" height="900" fill="#0c1321"/>
  <text x="80" y="56" fill="#69dbcf" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">TABLE I / REPLICATION</text>
  <text x="80" y="119" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700">Main Replication Result</text>
  <text x="80" y="163" fill="#a9b9c9" font-family="Arial, Helvetica, sans-serif" font-size="24">Gross annualized Sharpe ratio (SR)  |  Higher is better</text>
  <rect x="80" y="195" width="18" height="18" rx="4" fill="#69dbcf"/>
  <text x="111" y="211" fill="#d9e3eb" font-family="Arial, Helvetica, sans-serif" font-size="19">Our replication</text>
  <rect x="313" y="195" width="18" height="18" rx="4" fill="#70849d"/>
  <text x="344" y="211" fill="#d9e3eb" font-family="Arial, Helvetica, sans-serif" font-size="19">Paper</text>

  <rect x="80" y="238" width="700" height="444" rx="18" fill="#152235" stroke="#304157"/>
  <rect x="820" y="238" width="700" height="444" rx="18" fill="#152235" stroke="#304157"/>
  <text x="106" y="284" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">FF5 residuals</text>
  <text x="846" y="284" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">PCA5 residuals</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#d9e3eb">
    <text x="106" y="333">CNN+Transformer</text>
    <text x="106" y="458">Fourier+FFN</text>
    <text x="106" y="583">OU+Threshold</text>
    <text x="846" y="333">CNN+Transformer</text>
    <text x="846" y="458">Fourier+FFN</text>
    <text x="846" y="583">OU+Threshold</text>
  </g>
  <g stroke="#27384c" stroke-width="1">
    <path d="M285 384H748 M285 509H748 M1025 384H1488 M1025 509H1488"/>
  </g>
  <g fill="#69dbcf">
    <rect x="285" y="318" width="195" height="20" rx="4"/>
    <rect x="285" y="443" width="94" height="20" rx="4"/>
    <rect x="285" y="568" width="15" height="20" rx="4"/>
    <rect x="1025" y="318" width="266" height="20" rx="4"/>
    <rect x="1025" y="443" width="132" height="20" rx="4"/>
    <rect x="1025" y="568" width="62" height="20" rx="4"/>
  </g>
  <g fill="#70849d">
    <rect x="285" y="350" width="321" height="20" rx="4"/>
    <rect x="285" y="475" width="166" height="20" rx="4"/>
    <rect x="285" y="600" width="38" height="20" rx="4"/>
    <rect x="1025" y="350" width="336" height="20" rx="4"/>
    <rect x="1025" y="475" width="198" height="20" rx="4"/>
    <rect x="1025" y="600" width="73" height="20" rx="4"/>
  </g>
  <g fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
    <text x="492" y="336">1.95</text>
    <text x="618" y="368">3.21</text>
    <text x="391" y="461">0.94</text>
    <text x="463" y="493">1.66</text>
    <text x="312" y="586">0.15</text>
    <text x="335" y="618">0.38</text>
    <text x="1303" y="336">2.66</text>
    <text x="1373" y="368">3.36</text>
    <text x="1169" y="461">1.32</text>
    <text x="1235" y="493">1.98</text>
    <text x="1099" y="586">0.62</text>
    <text x="1110" y="618">0.73</text>
  </g>

  <rect x="80" y="711" width="1440" height="113" rx="18" fill="#1c3043"/>
  <path d="M556 733V802 M1043 733V802" stroke="#385069"/>
  <text x="105" y="755" fill="#69dbcf" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">RANKING REPRODUCED</text>
  <text x="105" y="790" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">CNN &gt; Fourier &gt; OU</text>
  <text x="582" y="755" fill="#69dbcf" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">LOWER ABSOLUTE SR</text>
  <text x="582" y="790" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">CNN: 1.95 vs 3.21 (FF5)</text>
  <text x="1068" y="755" fill="#69dbcf" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PCA5 OUTPERFORMS FF5</text>
  <text x="1068" y="790" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="22">CNN: 2.66 vs 1.95 (ours)</text>

  <text x="80" y="861" fill="#a9b9c9" font-family="Arial, Helvetica, sans-serif" font-size="16">Our OOS: 2003-02 to 2016-12. CNN: mean SR across 2 seeds; other models: 1 seed. Paper: reported Table I values. Gross = before costs.</text>
</svg>
